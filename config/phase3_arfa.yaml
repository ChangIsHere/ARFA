locked: false
protocol_version: phase3-dual-model-v1
stage: phase3_development
scope: online_dual_model_evaluation
formal_claims_enabled: false
use_phase3_final_tasks: false
engineering_gate_result: evidence/phase1_5_exploratory/exploratory_gate.json
reason: Development runs are enabled; final tasks remain locked until the controller is frozen.

model:
  model_interface: ollama_native_structured
  base_url: http://localhost:11434/v1
  api_key_env: ARFA_LOCAL_MODEL_API_KEY
  temperature: 0.0
  max_tokens: 900
  context_length: 8192
  request_timeout_seconds: 180
  request_attempts: 3
  keep_alive: -1

pairs:
  qwen:
    fast_model: arfa-qwen2.5-coder:7b-8k
    slow_model: arfa-qwen2.5-coder:14b-8k
    fast_baseline_dir: qwen2.5-coder-7b
    slow_baseline_dir: qwen2.5-coder-14b
  llama:
    fast_model: arfa-llama3.2:3b-8k
    slow_model: arfa-llama3.1:8b-8k
    fast_baseline_dir: llama3.2-3b
    slow_baseline_dir: llama3.1-8b
  gemma:
    fast_model: arfa-gemma3:4b-8k
    slow_model: arfa-gemma3:12b-8k
    fast_baseline_dir: gemma3-4b
    slow_baseline_dir: gemma3-12b
  phi:
    fast_model: arfa-phi4-mini:3.8b-8k
    slow_model: arfa-phi4:14b-8k
    fast_baseline_dir: phi4-mini-3.8b
    slow_baseline_dir: phi4-14b

agent:
  max_steps: 12
  maximum_identical_action_occurrences: 2

router:
  threshold_source: phase1_5_starting_point_then_phase3_development_calibration
  residual_method: structured_expectation_observation
  residual_threshold: 0.35
  observation_threshold: 0.55
  minimum_expectation_quality: 0.70
  max_consecutive_fast_calls: 1
  fail_open_to_reasoning: true

data:
  task_path: data/phase2/intercode_nl2bash_official_200.jsonl
  split_path: data/phase1_5/task_splits.json
  development_tasks: 100
  final_tasks: 100

environment:
  image_prefix: arfa/intercode-nl2bash:fs
  command_timeout_seconds: 20
  max_observation_chars: 4000
  container_memory: 1g
  network_mode: bridge

outputs:
  result_root: results/phase3_arfa
