locked: true
protocol_version: phase3-qwen-final-v1
stage: phase3_final
scope: frozen_online_router_evaluation
formal_claims_enabled: true
use_phase3_final_tasks: true
engineering_gate_result: evidence/phase1_5_exploratory/exploratory_gate.json
freeze_manifest: evidence/phase3_final/qwen_freeze_manifest.json
reason: Frozen Qwen evaluation on the reserved 100-task split.

model:
  model_interface: ollama_native_structured
  base_url: http://127.0.0.1:11439/v1
  api_key_env: ARFA_LOCAL_MODEL_API_KEY
  temperature: 0.0
  max_tokens: 900
  context_length: 8192
  request_timeout_seconds: 600
  request_attempts: 3
  keep_alive: -1

pairs:
  qwen:
    fast_model: arfa-qwen2.5-coder:7b-8k
    slow_model: arfa-qwen2.5-coder:14b-8k
    fast_model_artifact_identity: base_id=dae161e27b0e;alias_id=c8cb1b0bc968;num_ctx=8192
    slow_model_artifact_identity: base_id=9ec8897f747e;alias_id=ffe7be5e51ab;num_ctx=8192
    fast_baseline_dir: qwen2.5-coder-7b
    slow_baseline_dir: qwen2.5-coder-14b

agent:
  max_steps: 12
  maximum_identical_action_occurrences: 2
  max_history_turns: 2

execution:
  trajectory_workers: 48
  inference_parallelism: 2

router:
  threshold_source: frozen_from_development
  residual_method: structured_expectation_observation
  residual_threshold: 0.35
  observation_threshold: 0.55
  minimum_expectation_quality: 0.70
  max_consecutive_fast_calls: 1
  fail_open_to_reasoning: true
  fast_call_budget: 0.40
  random_seed: 1507
  learned_observation_only:
    annotation_path: data/phase1_5/annotation/primary_ai_labeled.jsonl
    source_map_path: data/phase1_5/annotation/private_source_map.jsonl
    threshold: 0.6030643268693344
    seed: 1507
    calibration_path: evidence/phase3_design/supplementary/learned_observation_validation.json

data:
  task_path: data/phase2/intercode_nl2bash_official_200.jsonl
  split_path: data/phase1_5/task_splits.json
  development_tasks: 100
  final_tasks: 100

environment:
  image_prefix: arfa/intercode-nl2bash:fs
  command_timeout_seconds: 20
  max_observation_chars: 4000
  container_memory: 1g
  network_mode: bridge

outputs:
  result_root: results/phase3_arfa/final/qwen-v1
