pairs:
  gemma:
    fast_model: arfa-gemma3:4b-8k
    slow_model: arfa-gemma3:12b-8k
    fast_model_artifact_identity: base_id=68ceab7e468a;alias_id=d824d4bbb7d8;num_ctx=8192
    slow_model_artifact_identity: base_id=b92b218582c5;alias_id=a44486f62aeb;num_ctx=8192
