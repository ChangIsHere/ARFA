  base_url: http://127.0.0.1:11440/v1
  api_key_env: ARFA_LOCAL_MODEL_API_KEY
  temperature: 0.0
  max_tokens: 900
  context_length: 8192
  request_timeout_seconds: 600
  request_attempts: 3
