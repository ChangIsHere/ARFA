  final_tasks: 100

environment:
  image_prefix: arfa/intercode-nl2bash:fs
  command_timeout_seconds: 20
  max_observation_chars: 4000
  container_memory: 1g
  network_mode: bridge

outputs:
  result_root: results/phase3_arfa/final/gemma-v3
