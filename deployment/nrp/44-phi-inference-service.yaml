apiVersion: batch/v1
kind: Job
metadata:
  name: arfa-phi-inference-run
  namespace: ucr-qzhang
  labels:
    app.kubernetes.io/name: arfa
    app.kubernetes.io/component: phi-inference
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arfa
        app.kubernetes.io/component: phi-inference
        arfa.run-id: nrp-phi-high-memory-parallel4-workers16-development
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A40
                      - NVIDIA-L40
                      - NVIDIA-L40S
                      - NVIDIA-RTX-A6000
                      - NVIDIA-RTX-PRO-6000-Blackwell-Max-Q-Workstation-Edition
                      - Quadro-RTX-8000
                      - NVIDIA-A100-SXM4-80GB
                      - NVIDIA-A100-80GB-PCIe
                      - NVIDIA-H100-80GB-HBM3
                      - NVIDIA-H200-NVL
                      - NVIDIA-GH200-480GB
      containers:
        - name: ollama
          image: ollama/ollama:0.34.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - /opt/arfa/serve_phi.sh
          env:
            - name: ARFA_RUN_ID
              value: nrp-phi-high-memory-parallel4-workers16-development
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_MODELS
              value: /workspace/model-cache/ollama
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            - name: OLLAMA_LOAD_TIMEOUT
              value: 60m
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"
            - name: OLLAMA_NUM_PARALLEL
              value: "4"
          ports:
            - name: ollama
              containerPort: 11434
              protocol: TCP
          startupProbe:
            exec:
              command: ["/bin/bash", "-c", "test -f /tmp/arfa-ready"]
            periodSeconds: 10
            failureThreshold: 720
          readinessProbe:
            exec:
              command: ["/bin/bash", "-c", "test -f /tmp/arfa-ready"]
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 18Gi
              ephemeral-storage: 20Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: 48Gi
              ephemeral-storage: 20Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: config
              mountPath: /opt/arfa
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: arfa-nrp-workspace
        - name: config
          configMap:
            name: arfa-phi-residency-config
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: arfa-phi-inference
  namespace: ucr-qzhang
  labels:
    app.kubernetes.io/name: arfa
    app.kubernetes.io/component: phi-inference
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: arfa
    app.kubernetes.io/component: phi-inference
  ports:
    - name: ollama
      port: 11434
      targetPort: ollama
      protocol: TCP
