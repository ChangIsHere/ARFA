apiVersion: batch/v1
kind: Job
metadata: {name: arfa-mixed-gemma4-qwen14-run, namespace: ucr-qzhang}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 54000
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {app.kubernetes.io/name: arfa, app.kubernetes.io/component: mixed-gemma4-qwen14}
    spec:
      priorityClassName: opportunistic2
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: nvidia.com/gpu.product, operator: In, values: [NVIDIA-RTX-A6000]}
      containers:
        - name: ollama
          image: ollama/ollama:0.34.1
          command: ["/bin/bash", "-lc"]
          args:
            - |
              /opt/arfa/serve_pair.sh & pid=$!
              trap 'kill "${pid}" 2>/dev/null || true; wait "${pid}" 2>/dev/null || true' EXIT
              for _ in $(seq 1 90); do [[ -f /tmp/arfa-ready ]] && break; kill -0 "${pid}" || wait "${pid}"; sleep 60; done
              [[ -f /tmp/arfa-ready ]]
              ready_at=$(date +%s)
              while kill -0 "${pid}" 2>/dev/null; do
                sleep 60
                heartbeat=$(stat -c %Y /tmp/arfa-runner-heartbeat 2>/dev/null || printf '%s' "${ready_at}")
                (( $(date +%s) - heartbeat <= 1200 )) || exit 0
              done
          env:
            - {name: ARFA_RUN_ID, value: phase3-mixed-gemma4-qwen14-v1}
            - {name: OLLAMA_HOST, value: "0.0.0.0:11434"}
            - {name: OLLAMA_MODELS, value: /workspace/model-cache/ollama}
            - {name: OLLAMA_KEEP_ALIVE, value: "-1"}
            - {name: OLLAMA_LOAD_TIMEOUT, value: 60m}
            - {name: OLLAMA_MAX_LOADED_MODELS, value: "2"}
            - {name: OLLAMA_NUM_PARALLEL, value: "8"}
          ports: [{name: ollama, containerPort: 11434}]
          startupProbe:
            exec: {command: ["/bin/bash", "-c", "test -f /tmp/arfa-ready"]}
            periodSeconds: 10
            failureThreshold: 540
          resources:
            requests: {cpu: 100m, memory: 1Gi, ephemeral-storage: 20Gi, nvidia.com/rtxa6000: "1"}
            limits: {cpu: "4", memory: 30Gi, ephemeral-storage: 20Gi, nvidia.com/rtxa6000: "1"}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: config, mountPath: /opt/arfa, readOnly: true}
      volumes:
        - {name: workspace, persistentVolumeClaim: {claimName: arfa-nrp-workspace}}
        - {name: config, configMap: {name: arfa-mixed-gemma4-qwen14-config, defaultMode: 0555}}
---
apiVersion: v1
kind: Service
metadata: {name: arfa-mixed-gemma4-qwen14, namespace: ucr-qzhang}
spec:
  selector: {app.kubernetes.io/name: arfa, app.kubernetes.io/component: mixed-gemma4-qwen14}
  ports: [{name: ollama, port: 11434, targetPort: ollama}]
