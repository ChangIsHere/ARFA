apiVersion: batch/v1
kind: Job
metadata:
  name: arfa-qwen-controls-run
  namespace: ucr-qzhang
  labels:
    app.kubernetes.io/name: arfa
    app.kubernetes.io/component: qwen-controls
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 43200
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arfa
        app.kubernetes.io/component: qwen-controls
        arfa.run-id: nrp-qwen-controls-v1
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-L40
      containers:
        - name: ollama
          image: ollama/ollama:0.34.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              /opt/arfa/serve_qwen.sh &
              server_pid=$!
              trap 'kill "${server_pid}" 2>/dev/null || true; wait "${server_pid}" 2>/dev/null || true' EXIT
              for _ in $(seq 1 60); do
                if [[ -f /tmp/arfa-ready ]]; then break; fi
                if ! kill -0 "${server_pid}" 2>/dev/null; then wait "${server_pid}"; exit 1; fi
                sleep 60
              done
              [[ -f /tmp/arfa-ready ]] || exit 1
              ready_at=$(date +%s)
              while kill -0 "${server_pid}" 2>/dev/null; do
                sleep 60
                heartbeat=$(stat -c %Y /tmp/arfa-runner-heartbeat 2>/dev/null || printf '%s' "${ready_at}")
                if (( $(date +%s) - heartbeat > 1200 )); then
                  echo "Runner heartbeat expired; stopping idle inference Job" >&2
                  exit 0
                fi
              done
              wait "${server_pid}"
          env:
            - name: ARFA_RUN_ID
              value: nrp-qwen-controls-v1
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_MODELS
              value: /workspace/model-cache/ollama
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            - name: OLLAMA_LOAD_TIMEOUT
              value: 20m
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"
            - name: OLLAMA_NUM_PARALLEL
              value: "8"
          ports:
            - name: ollama
              containerPort: 11434
              protocol: TCP
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - test -f /tmp/arfa-ready
            periodSeconds: 10
            failureThreshold: 360
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - test -f /tmp/arfa-ready
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 32Gi
              ephemeral-storage: 20Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: 1200m
              memory: 32Gi
              ephemeral-storage: 20Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: config
              mountPath: /opt/arfa
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: arfa-nrp-workspace
        - name: config
          configMap:
            name: arfa-qwen-residency-config
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: arfa-qwen-controls
  namespace: ucr-qzhang
  labels:
    app.kubernetes.io/name: arfa
    app.kubernetes.io/component: qwen-controls
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: arfa
    app.kubernetes.io/component: qwen-controls
  ports:
    - name: ollama
      port: 11434
      targetPort: ollama
      protocol: TCP
