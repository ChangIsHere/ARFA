apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arfa-nrp-workspace
  namespace: ucr-qzhang
  labels:
    app.kubernetes.io/name: arfa
    app.kubernetes.io/component: persistent-workspace
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-block
  volumeMode: Filesystem
  resources:
    requests:
      storage: 200Gi
